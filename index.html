<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- viewport-fit=cover so the safe-area insets work on notched phones. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0a0a0a" />
    <meta
      name="description"
      content="Training split, macros, and cardio calories from fixed formulas. Free, no account."
    />
    <!-- Fonts are self-hosted (public/fonts, SIL OFL) — no font CDN, so the
         page has no third-party runtime dependency. Anton and DM Mono are
         the only faces above the fold, so those two are preloaded. -->
    <link
      rel="preload"
      href="/fonts/anton-v27-latin-400.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/dm-mono-v16-latin-400.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <title>Lite Tools</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
